name: Casewake full flashloan route simulation
on:
  push:
    branches: ["fix/casewake-route-economics-20261106"]
    paths:
      - "web/scripts/simulate-flashloan-repair.mjs"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - ".github/workflows/flashloan-repair-simulation.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@10.22.0 --activate
      - name: Install pinned SDK and refresh lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Sweep complete flashloan PTB across reserve-aware trade sizes
        run: |
          for size in 64600000000 64200000000 64000000000 63500000000 63000000000 62500000000 62000000000 61000000000 60000000000; do
            echo "Simulating trade size $size MIST"
            CASEWAKE_TRADE_SIZE_MIST="$size" node scripts/simulate-flashloan-repair.mjs || echo "Simulation script failed for $size; preserving other attempts."
          done
      - name: Commit lockfile and simulation evidence
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/pnpm-lock.yaml evidence/flashloan-sequential-pool-simulation-*.json
          if git diff --cached --quiet; then
            echo "No lockfile or simulation evidence changes."
            exit 0
          fi
          git commit -m "evidence(casewake): simulate sequential flashloan route"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Preserve full transaction simulation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: casewake-full-flashloan-simulation
          path: evidence/flashloan-sequential-pool-simulation-*.json
          if-no-files-found: error
          retention-days: 14
